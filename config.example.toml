[app]
host = "127.0.0.1"
port = 8765
# data_dir = "D:/AIVAgent/data" # 默认 %LOCALAPPDATA%/AIVAgent/data

[sharing]
# 留空时仅供本机使用；填写后允许无需登录的公开共享访问。
public_origin = ""
writes_per_minute = 30
max_request_bytes = 94371840 # 每次上传总大小90MiB，适配公网代理限制

[comfyui]
base_url = "http://127.0.0.1:8188"
output_read_root = "F:/ComfyUI/ComfyUI_windows_portable/ComfyUI/output"
max_outstanding_tasks = 10
image_timeout_seconds = 900
video_timeout_seconds = 1800
auto_free_after_idle_seconds = 300

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
reasoning_effort = "low"
max_input_tokens = 131072
history_summary_threshold_tokens = 98304
history_recent_tokens = 24576
max_output_tokens = 8192
# 每轮只发送明确选中的图片，原文件和ComfyUI输入保持原尺寸
vision_max_images = 6
vision_max_edge = 1536
timeout_seconds = 60
turn_budget_usd = 0.15
daily_budget_usd = 0.50

[storage]
minimum_free_bytes = 2147483648
max_import_file_bytes = 2147483648
